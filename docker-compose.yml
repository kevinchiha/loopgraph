services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-pg:/var/lib/postgresql/data
    networks: [temporal-net]

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on: [postgresql]
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      # Loopback only. The frontend has no auth and no TLS, and a merge approval
      # is just a Temporal signal, so publishing this on 0.0.0.0 let anyone on the
      # same wifi approve a merge or start a workflow that runs code as the worker.
      - "127.0.0.1:7233:7233"
    networks: [temporal-net]

  temporal-ui:
    image: temporalio/ui:2.53.3
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"
    networks: [temporal-net]

  worker:
    build:
      context: .
      args:
        # The agent writes into your repos through a bind mount, so the container
        # user must be you. Default 1000 is right on most single-user Linux boxes;
        # install.sh writes your real id.
        LOOPGRAPH_UID: ${LOOPGRAPH_UID:-1000}
    depends_on: [temporal]
    # host network: reaches CLIProxyAPI on 127.0.0.1:8317 without LAN exposure;
    # Temporal is reachable via its published port.
    network_mode: host
    environment:
      TEMPORAL_ADDRESS: localhost:7233
      LOOPGRAPH_IN_CONTAINER: "1"
    env_file:
      - path: .env
        required: false
      # Required. Runs stop and ask the owner questions, so the engine refuses to
      # start without a way to reach them. `lg approve` answers a waiting run from
      # a terminal, but it is not a substitute for being told there is one.
      - path: ${LOOPGRAPH_TELEGRAM_ENV:?not set - run ./install.sh}
        required: true
    volumes:
      - ./:/app
      # The only tree the agent can reach. Target repos must live under it.
      - ${LOOPGRAPH_PROJECTS_DIR:?not set - run ./install.sh}:/projects
      # Shared npm cache so gates that run `npm ci` in a fresh worktree are not slow.
      - ${LOOPGRAPH_NPM_CACHE:?not set - run ./install.sh}:/home/worker/.npm
    # No restart policy, here or on the dispatcher, on purpose. Postgres and
    # temporal do not come back after a reboot, so a worker that did came up
    # against a database that was not there and crash-looped for hours while the
    # engine looked like it was running. Bring the stack up deliberately with
    # `docker compose up -d`.

  browser:
    # Chromium for runs that declare a web app in browser.yaml. Behind a profile
    # because the image is about 1.5GB and most runs never open a page:
    # COMPOSE_PROFILES=browser in .env is the switch. Host network, like the
    # worker, because the app it looks at is served on the worker's 127.0.0.1.
    # Chromium is started with its own debugging port and the worker attaches
    # over CDP, so neither side cares which Playwright version the other runs.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [browser]
    network_mode: host
    ipc: host
    init: true
    command:
      - /bin/sh
      - -c
      - >-
        exec /ms-playwright/chromium-*/chrome-linux*/chrome
        --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage
        --remote-debugging-address=127.0.0.1
        --remote-debugging-port=${LOOPGRAPH_BROWSER_PORT:-8420}
        --user-data-dir=/tmp/loopgraph-chromium
        about:blank
    # No restart policy, for the reason the worker has none.

  dispatcher:
    # The only thing that reads Telegram. Telegram allows one getUpdates per bot,
    # and text replies carry no run id, so runs polling for themselves fought over
    # the connection and ate each other's answers. This routes each update to the
    # run it names and signals that workflow.
    build:
      context: .
      args:
        LOOPGRAPH_UID: ${LOOPGRAPH_UID:-1000}
    depends_on: [temporal]
    network_mode: host
    environment:
      TEMPORAL_ADDRESS: localhost:7233
    env_file:
      - path: .env
        required: false
      - path: ${LOOPGRAPH_TELEGRAM_ENV:?not set - run ./install.sh}
        required: true
    volumes:
      - ./:/app
    command: ["python", "dispatcher.py"]

volumes:
  temporal-pg:

networks:
  temporal-net:
