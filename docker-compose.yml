services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-pg:/var/lib/postgresql/data
    networks: [temporal-net]

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on: [postgresql]
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"
    networks: [temporal-net]

  temporal-ui:
    image: temporalio/ui:2.53.3
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"
    networks: [temporal-net]

  worker:
    build:
      context: .
      args:
        # The agent writes into your repos through a bind mount, so the container
        # user must be you. Default 1000 is right on most single-user Linux boxes;
        # install.sh writes your real id.
        LOOPGRAPH_UID: ${LOOPGRAPH_UID:-1000}
    depends_on: [temporal]
    # host network: reaches CLIProxyAPI on 127.0.0.1:8317 without LAN exposure;
    # Temporal is reachable via its published port.
    network_mode: host
    environment:
      TEMPORAL_ADDRESS: localhost:7233
      LOOPGRAPH_IN_CONTAINER: "1"
    env_file:
      - path: .env
        required: false
      # Telegram is optional: a run can also be answered with `lg approve`.
      # The path must be set (install.sh writes it), but the file may be absent.
      # If you did configure a bot, install.sh also sets LOOPGRAPH_REQUIRE_TELEGRAM=1
      # and the worker refuses to start without the credentials, so a run can never
      # stall waiting on a card that was never going to arrive.
      - path: ${LOOPGRAPH_TELEGRAM_ENV:?not set - run ./install.sh}
        required: false
    volumes:
      - ./:/app
      # The only tree the agent can reach. Target repos must live under it.
      - ${LOOPGRAPH_PROJECTS_DIR:?not set - run ./install.sh}:/projects
      # Shared npm cache so gates that run `npm ci` in a fresh worktree are not slow.
      - ${LOOPGRAPH_NPM_CACHE:?not set - run ./install.sh}:/home/worker/.npm
    restart: unless-stopped

volumes:
  temporal-pg:

networks:
  temporal-net:
